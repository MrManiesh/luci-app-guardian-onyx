name: Build OpenWrt APK Package

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - 'scratch/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - 'scratch/**'
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    name: Build APK Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build APK Package (Alpine apk mkpkg)
        run: bash .github/scripts/package-apk.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-guardian-onyx-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
